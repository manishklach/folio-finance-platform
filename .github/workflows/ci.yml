name: CI
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run migrate
        env:
          PLATFORM_DB_PATH: data/ci-platform.db
      - run: npm run migrate:rehearse
      - name: Exercise documented single-node capacity envelope
        run: npm run test:load
      - run: docker build --check .
      - run: docker build -t folio-ci:${{ github.sha }} .
      - name: Scan production image for high-impact vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: folio-ci:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: Validate production Compose topology
        run: docker compose -f compose.production.yml config --quiet
        env:
          FOLIO_DOMAIN: folio.example.test
          BACKUP_KEY_ID: ci-backup-key
          ALERT_WEBHOOK_URL_FILE: .env.example
          BACKUP_ENCRYPTION_KEY_FILE: .env.example
          OPENAI_API_KEY_FILE: .env.example
          SENTRY_DSN_FILE: .env.example
          BOOTSTRAP_TOKEN_FILE: .env.example
      - name: Validate monitoring configuration
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/ops:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/amtool -v "$PWD/ops:/etc/alertmanager:ro" -v "$PWD/.env.example:/run/secrets/alert_webhook_url:ro" prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
