name: CI
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run migrate
        env:
          PLATFORM_DB_PATH: data/ci-platform.db
