name: folio

services:
  folio:
    image: ${FOLIO_IMAGE:-folio:local}
    build:
      context: .
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4310
      PUBLIC_ORIGIN: https://${FOLIO_DOMAIN:?Set FOLIO_DOMAIN}
      SESSION_COOKIE_SECURE: "true"
      PLATFORM_DB_PATH: /var/lib/folio/platform.db
      TENANT_DB_DIR: /var/lib/folio/tenants
      ATTACHMENT_DIR: /var/lib/folio/attachments
      SENTRY_DSN_FILE: /run/secrets/sentry_dsn
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      AI_MONTHLY_DRAFT_LIMIT: ${AI_MONTHLY_DRAFT_LIMIT:-200}
      SHUTDOWN_TIMEOUT_MS: 20000
    secrets:
      - sentry_dsn
      - openai_api_key
      - bootstrap_token
    volumes:
      - folio_data:/var/lib/folio
      - folio_attachments:/var/lib/folio/attachments
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks: [backend]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4310/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 4

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      FOLIO_DOMAIN: ${FOLIO_DOMAIN:?Set FOLIO_DOMAIN}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, backend]
    depends_on:
      folio:
        condition: service_healthy

  webhook-worker:
    image: ${FOLIO_IMAGE:-folio:local}
    restart: unless-stopped
    init: true
    read_only: true
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      PLATFORM_DB_PATH: /var/lib/folio/platform.db
      TENANT_DB_DIR: /var/lib/folio/tenants
      WEBHOOK_WORKER_POLL_MS: ${WEBHOOK_WORKER_POLL_MS:-1000}
      WEBHOOK_WORKER_LEASE_SECONDS: ${WEBHOOK_WORKER_LEASE_SECONDS:-60}
      WEBHOOK_WORKER_MAX_ATTEMPTS: ${WEBHOOK_WORKER_MAX_ATTEMPTS:-8}
    volumes:
      - folio_data:/var/lib/folio
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    networks: [backend]
    depends_on:
      folio:
        condition: service_healthy
    command: [npm, run, webhooks:worker]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks: [backend]
    depends_on:
      folio:
        condition: service_healthy
      alertmanager:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    secrets:
      - alert_webhook_url
    volumes:
      - ./ops/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks: [backend]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:9093/-/ready]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 4

  migrate:
    profiles: [operations]
    image: ${FOLIO_IMAGE:-folio:local}
    read_only: true
    user: node
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PLATFORM_DB_PATH: /var/lib/folio/platform.db
    volumes:
      - folio_data:/var/lib/folio
    tmpfs: [/tmp:rw, noexec, nosuid, size=32m]
    command: [node, scripts/migrate.js]

  backup:
    profiles: [operations]
    image: ${FOLIO_IMAGE:-folio:local}
    read_only: true
    user: node
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      PLATFORM_DB_PATH: /var/lib/folio/platform.db
      BACKUP_DIR: /var/backups/folio
      ATTACHMENT_DIR: /var/lib/folio/attachments
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
      BACKUP_KEY_ID: ${BACKUP_KEY_ID:?Set BACKUP_KEY_ID}
    secrets:
      - backup_encryption_key
    volumes:
      - folio_data:/var/lib/folio
      - folio_attachments:/var/lib/folio/attachments:ro
      - folio_backups:/var/backups/folio
    tmpfs: [/tmp:rw, noexec, nosuid, size=32m]
    command: [node, scripts/backup.js]

networks:
  edge: {}
  backend:
    internal: true

volumes:
  folio_data: {}
  folio_attachments: {}
  folio_backups: {}
  caddy_data: {}
  caddy_config: {}
  prometheus_data: {}
  alertmanager_data: {}

secrets:
  bootstrap_token:
    file: ${BOOTSTRAP_TOKEN_FILE:?Set BOOTSTRAP_TOKEN_FILE}
  alert_webhook_url:
    file: ${ALERT_WEBHOOK_URL_FILE:?Set ALERT_WEBHOOK_URL_FILE}
  backup_encryption_key:
    file: ${BACKUP_ENCRYPTION_KEY_FILE:?Set BACKUP_ENCRYPTION_KEY_FILE}
  openai_api_key:
    file: ${OPENAI_API_KEY_FILE:?Set OPENAI_API_KEY_FILE}
  sentry_dsn:
    file: ${SENTRY_DSN_FILE:?Set SENTRY_DSN_FILE}
